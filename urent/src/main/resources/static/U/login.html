<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - U-Rent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      .auth-bg {
        background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%);
      }
    </style>
  </head>
  <body class="h-screen flex items-center justify-center auth-bg">
    <div class="bg-white p-8 rounded-xl shadow-xl w-96">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-2">Welcome Back</h1>
        <p class="text-gray-600">Access your U-Rent account</p>
      </div>

      <div
        id="errorMessage"
        class="hidden mb-4 p-4 bg-red-100 text-red-700 rounded-lg"
      ></div>

      <form id="loginForm" class="space-y-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Email</label
          >
          <input
            type="email"
            id="email"
            required
            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Password</label
          >
          <input
            type="password"
            id="password"
            required
            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <button
          type="submit"
          class="w-full py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors flex items-center justify-center"
        >
          <i class="fas fa-sign-in-alt mr-2"></i> Sign In
        </button>
      </form>

      <div class="mt-6 text-center space-y-3">
        <a
          href="./forgot-password.html"
          class="text-sm text-blue-600 hover:underline"
          >Forgot Password?</a
        >
        <p class="text-gray-600 text-sm">
          New to U-Rent?
          <a href="./user/signup.html" class="text-blue-600 hover:underline"
            >Create Account</a
          >
        </p>
      </div>
    </div>

    <!-- Only need login.js -->
    <script src="./js/login.js"></script>
  </body>
</html>
