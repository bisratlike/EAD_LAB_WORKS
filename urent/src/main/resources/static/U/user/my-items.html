<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Items - U-Rent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body class="bg-gray-100 min-h-screen">
    <!-- Navigation Bar -->
    <nav class="bg-white shadow-lg">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
          <div class="flex items-center">
            <a href="../index.html" class="text-2xl font-bold text-blue-600"
              >U-Rent</a
            >
          </div>
          <div class="flex items-center space-x-4">
            <a href="../index.html" class="text-gray-600 hover:text-blue-600"
              >Home</a
            >
            <a href="my-items.html" class="text-blue-600 font-semibold"
              >My Items</a
            >
            <button onclick="logout()" class="text-gray-600 hover:text-red-600">
              Logout
            </button>
          </div>
        </div>
      </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold text-gray-900">My Listed Items</h1>
        <a
          href="./post-item.html"
          class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition-colors"
        >
          <i class="fas fa-plus mr-2"></i>Post New Item
        </a>
      </div>

      <!-- Items Grid -->
      <div
        id="items-container"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
      >
        <!-- Items will be loaded here -->
      </div>
    </div>

    <!-- Edit Modal -->
    <div
      id="editModal"
      class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center"
    >
      <div class="bg-white rounded-lg p-8 w-full max-w-md">
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-2xl font-bold text-gray-900">Edit Item</h2>
          <button
            onclick="closeModal()"
            class="text-gray-500 hover:text-gray-700"
          >
            <i class="fas fa-times"></i>
          </button>
        </div>
        <form id="editForm" class="space-y-4">
          <input type="hidden" id="editItemId" />
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >Title</label
            >
            <input
              type="text"
              id="editTitle"
              required
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >Description</label
            >
            <textarea
              id="editDescription"
              required
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 h-32"
            ></textarea>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >Price (per day)</label
            >
            <input
              type="number"
              id="editPrice"
              required
              min="0"
              step="0.01"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
            />
          </div>
          <button
            type="submit"
            class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition-colors"
          >
            Save Changes
          </button>
        </form>
      </div>
    </div>

    <script>
      const token = localStorage.getItem("authToken");
      if (!token) {
        window.location.href = "../login.html";
      }

      function logout() {
        localStorage.removeItem("authToken");
        localStorage.removeItem("userData");
        window.location.href = "../login.html";
      }

      // Load items when page loads
      document.addEventListener("DOMContentLoaded", loadUserItems);

      async function loadUserItems() {
        const container = document.getElementById("items-container");
        container.innerHTML =
          '<div class="col-span-full text-center py-8"><i class="fas fa-spinner fa-spin text-blue-600 text-3xl"></i></div>';

        try {
          const response = await fetch(
            "http://localhost:8090/api/items/my-items",
            {
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
              },
            }
          );

          if (response.status === 401) {
            localStorage.removeItem("authToken");
            localStorage.removeItem("userData");
            window.location.href = "../login.html";
            return;
          }

          if (!response.ok) {
            const errorData = await response.text();
            throw new Error(errorData || "Failed to load items");
          }

          const items = await response.json();
          console.log("Fetched items:", items); // Debug log

          if (items.length === 0) {
            container.innerHTML = `
              <div class="col-span-full text-center py-12">
                <i class="fas fa-box-open text-gray-400 text-5xl mb-4"></i>
                <p class="text-gray-600 text-lg">You haven't listed any items yet.</p>
                <a href="../post-item.html" class="inline-block mt-4 bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition-colors">
                  <i class="fas fa-plus mr-2"></i>Post Your First Item
                </a>
              </div>
            `;
            return;
          }

          renderItems(items);
        } catch (error) {
          console.error("Error:", error);
          container.innerHTML = `
            <div class="col-span-full text-center py-8">
              <div class="bg-red-100 text-red-700 p-4 rounded-lg inline-block">
                <i class="fas fa-exclamation-circle mr-2"></i>
                Failed to load items: ${error.message}
                <button onclick="loadUserItems()" class="ml-4 text-blue-600 hover:text-blue-800">
                  <i class="fas fa-redo mr-1"></i>Retry
                </button>
              </div>
            </div>
          `;
        }
      }

      // Helper function to get image URL from photos array
      function getImageUrl(photos) {
        return photos && photos.length > 0
          ? `data:image/jpeg;base64,${photos[0]}`
          : null;
      }

      function renderItems(items) {
        const container = document.getElementById("items-container");
        container.innerHTML = "";

        items.forEach((item) => {
          console.log("Rendering item:", item); // Debug log
          const itemCard = document.createElement("div");
          itemCard.className =
            "bg-white rounded-lg shadow-md overflow-hidden transition-transform hover:scale-[1.02]";
          
          const imageUrl = getImageUrl(item.photos);
          console.log("Image URL:", imageUrl); // Debug log

          itemCard.innerHTML = `
            <div class="relative pb-[60%]">
              ${
                imageUrl
                  ? `<img src="${imageUrl}" class="absolute inset-0 w-full h-full object-cover" alt="${item.title}">`
                  : `<div class="absolute inset-0 bg-gray-200 flex items-center justify-center">
                      <i class="fas fa-image text-gray-400 text-4xl"></i>
                    </div>`
              }
            </div>
            <div class="p-4">
              <h3 class="text-xl font-semibold text-gray-900 mb-2">${
                item.title
              }</h3>
              <p class="text-gray-600 mb-4 line-clamp-2">${item.description}</p>
              <div class="flex items-center justify-between">
                <span class="text-lg font-bold text-blue-600">$${
                  item.price
                }/day</span>
                <div class="flex space-x-2">
                  <button onclick="openEditModal('${
                    item.id
                  }')" class="text-gray-600 hover:text-blue-600 p-2">
                    <i class="fas fa-edit"></i>
                  </button>
                  <button onclick="deleteItem('${
                    item.id
                  }')" class="text-gray-600 hover:text-red-600 p-2">
                    <i class="fas fa-trash"></i>
                  </button>
                </div>
              </div>
            </div>
          `;
          container.appendChild(itemCard);
        });
      }

      async function openEditModal(itemId) {
        try {
          const response = await fetch(
            `http://localhost:8090/api/items/${itemId}`,
            {
              headers: {
                Authorization: `Bearer ${token}`,
              },
            }
          );

          if (!response.ok) {
            throw new Error("Failed to fetch item details");
          }

          const item = await response.json();
          document.getElementById("editItemId").value = item.id;
          document.getElementById("editTitle").value = item.title;
          document.getElementById("editDescription").value = item.description;
          document.getElementById("editPrice").value = item.price;

          document.getElementById("editModal").classList.remove("hidden");
        } catch (error) {
          console.error("Error:", error);
          alert("Failed to load item details. Please try again.");
        }
      }

      async function handleEditSubmit(e) {
        e.preventDefault();

        const itemId = document.getElementById("editItemId").value;
        const updatedItem = {
          title: document.getElementById("editTitle").value,
          description: document.getElementById("editDescription").value,
          price: parseFloat(document.getElementById("editPrice").value),
        };

        try {
          const response = await fetch(
            `http://localhost:8090/api/items/${itemId}`,
            {
              method: "PUT",
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify(updatedItem),
            }
          );

          if (!response.ok) {
            const errorData = await response.text();
            throw new Error(errorData || "Failed to update item");
          }

          closeModal();
          loadUserItems(); // Refresh the list
        } catch (error) {
          console.error("Error:", error);
          alert("Failed to update item. Please try again.");
        }
      }

      async function deleteItem(itemId) {
        if (!confirm("Are you sure you want to delete this item?")) {
          return;
        }

        try {
          const response = await fetch(
            `http://localhost:8090/api/items/${itemId}`,
            {
              method: "DELETE",
              headers: {
                Authorization: `Bearer ${token}`,
              },
            }
          );

          if (!response.ok) {
            throw new Error("Failed to delete item");
          }

          loadUserItems(); // Refresh the list
        } catch (error) {
          console.error("Error:", error);
          alert("Failed to delete item. Please try again.");
        }
      }

      function closeModal() {
        document.getElementById("editModal").classList.add("hidden");
      }

      // Event listeners
      document
        .getElementById("editForm")
        .addEventListener("submit", handleEditSubmit);
    </script>
  </body>
</html>
