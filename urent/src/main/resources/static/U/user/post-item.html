<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U-Rent - Post Item</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .image-preview {
            transition: transform 0.3s ease;
        }
        .image-preview:hover {
            transform: scale(1.05);
        }
        .custom-file-input::-webkit-file-upload-button {
            visibility: hidden;
        }
        .custom-file-input::before {
            content: 'Select Images';
            display: inline-block;
            background: linear-gradient(to right, #3B82F6, #2563EB);
            color: white;
            border-radius: 0.5rem;
            padding: 0.5rem 1rem;
            outline: none;
            white-space: nowrap;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.875rem;
        }
        .custom-file-input:hover::before {
            background: linear-gradient(to right, #2563EB, #1D4ED8);
        }
        .custom-file-input:active::before {
            transform: scale(0.98);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-sm">
        <div class="container mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <a href="../index.html" class="text-2xl font-bold text-gray-800">U-Rent</a>
                <nav class="flex items-center space-x-6">
                    <!-- Show these links only when logged in -->
                    <div id="authLinks" style="display: none;">
                        <a href="post-item.html" class="text-gray-600 hover:text-blue-600">
                            <i class="fas fa-plus-circle mr-1"></i> Post Item
                        </a>
                        <a href="items.html" class="text-gray-600 hover:text-blue-600">
                            <i class="fas fa-box mr-1"></i> Items
                        </a>
                        <a href="bookmarks.html" class="text-gray-600 hover:text-blue-600">
                            <i class="fas fa-bookmark mr-1"></i> Bookmarks
                        </a>
                        <a href="global-chat.html" class="text-gray-600 hover:text-blue-600">
                            <i class="fas fa-comments mr-1"></i> Chat
                        </a>
                        <a href="profile.html" class="text-gray-600 hover:text-blue-600">
                            <i class="fas fa-user mr-1"></i> Profile
                        </a>
                        <button onclick="logout()" class="text-gray-600 hover:text-blue-600">
                            <i class="fas fa-sign-out-alt mr-1"></i> Logout
                        </button>
                    </div>
                    <!-- Show these links when not logged in -->
                    <div id="nonAuthLinks">
                        <a href="../login.html" class="text-gray-600 hover:text-blue-600">
                            <i class="fas fa-sign-in-alt mr-1"></i> Login
                        </a>
                    </div>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        <div class="max-w-3xl mx-auto">
            <!-- Page Title -->
            <h1 class="text-3xl font-bold text-gray-900 mb-8">Post New Item</h1>

            <!-- Status Messages -->
            <div id="statusMessages" class="mb-6">
                <div id="error-message" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative">
                    <span class="block sm:inline"></span>
                </div>
                <div id="success-message" class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative">
                    <span class="block sm:inline"></span>
                </div>
            </div>

            <!-- Post Item Form -->
            <form id="postItemForm" class="bg-white rounded-lg shadow-lg p-6 space-y-6">
                <!-- Title -->
                <div>
                    <label for="title" class="block text-sm font-medium text-gray-700">Title</label>
                    <input type="text" id="title" name="title" required
                        class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                        placeholder="What are you renting out?">
                </div>

                <!-- Description -->
                <div>
                    <label for="description" class="block text-sm font-medium text-gray-700">Description</label>
                    <textarea id="description" name="description" rows="4" required
                        class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                        placeholder="Describe your item in detail..."></textarea>
                </div>

                <!-- Price -->
                <div>
                    <label for="price" class="block text-sm font-medium text-gray-700">Price per Day (ETB)</label>
                    <div class="mt-1 relative rounded-lg">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <span class="text-gray-500 sm:text-sm">ETB</span>
                        </div>
                        <input type="number" id="price" name="price" required min="0" step="0.01"
                            class="block w-full pl-12 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                            placeholder="0.00">
                    </div>
                </div>

                <!-- Category -->
                <div>
                    <label for="category" class="block text-sm font-medium text-gray-700">Category</label>
                    <select id="category" name="category" required
                        class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white">
                        <option value="">Select a category</option>
                        <option value="electronics">Electronics</option>
                        <option value="furniture">Furniture</option>
                        <option value="tools">Tools</option>
                        <option value="vehicles">Vehicles</option>
                        <option value="clothing">Clothing</option>
                        <option value="books">Books</option>
                        <option value="sports">Sports Equipment</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <!-- Images -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Images</label>
                    <input type="file" id="image" name="image" accept="image/*" multiple
                        class="custom-file-input block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                    <p class="mt-1 text-sm text-gray-500">Upload up to 5 images of your item</p>
                    
                    <!-- Image Preview -->
                    <div id="photoPreviewsContainer" class="mt-4 grid grid-cols-2 md:grid-cols-3 gap-4">
                        <!-- Preview images will be added here -->
                    </div>
                    
                    <div id="loadingSpinner" class="hidden">
                        <i class="fas fa-spinner fa-spin"></i> Loading...
                    </div>
                </div>

                <!-- Location -->
                <div>
                    <label for="location" class="block text-sm font-medium text-gray-700">Location</label>
                    <input type="text" id="location" name="location" required
                        class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                        placeholder="Where is the item located?">
                </div>

                <!-- Availability -->
                <div>
                    <label class="block text-sm font-medium text-gray-700">Availability</label>
                    <div class="mt-2 flex items-center space-x-4">
                        <label class="inline-flex items-center">
                            <input type="radio" name="availability" value="AVAILABLE" checked
                                class="form-radio h-4 w-4 text-blue-600 focus:ring-blue-500">
                            <span class="ml-2 text-gray-700">Available Now</span>
                        </label>
                        <label class="inline-flex items-center">
                            <input type="radio" name="availability" value="RENTED_OUT"
                                class="form-radio h-4 w-4 text-blue-600 focus:ring-blue-500">
                            <span class="ml-2 text-gray-700">Rented Out</span>
                        </label>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="pt-4">
                    <button type="submit"
                        class="w-full bg-blue-600 text-white py-3 px-6 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors flex items-center justify-center space-x-2">
                        <i class="fas fa-plus-circle"></i>
                        <span>Post Item</span>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- Scripts -->
    <script src="../js/post-item.js"></script>
    <script>
        // Check authentication and redirect if not logged in
        const token = localStorage.getItem('authToken');
        const user = JSON.parse(localStorage.getItem('user') || 'null');
        
        if (!token || !user?.id) {
            localStorage.removeItem('authToken');
            localStorage.removeItem('user');
            window.location.href = '../login.html';
        }
    </script>
</body>
</html>
