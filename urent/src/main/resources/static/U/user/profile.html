<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - U-Rent</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50">
  <!-- Header -->
  <header class="bg-white shadow-sm">
    <div class="container mx-auto px-4 py-4">
      <div class="flex justify-between items-center">
        <a href="../index.html" class="text-2xl font-bold text-gray-800">U-Rent</a>
        <nav class="flex items-center space-x-6">
          <a href="items.html" class="text-gray-600 hover:text-blue-600">
            <i class="fas fa-box mr-1"></i> Items
          </a>
          <a href="bookmarks.html" class="text-gray-600 hover:text-blue-600">
            <i class="fas fa-bookmark mr-1"></i> Bookmarks
          </a>
        </nav>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container mx-auto px-4 py-8 max-w-2xl">
    <div class="bg-white rounded-lg shadow-lg p-6">
      <h1 class="text-3xl font-bold text-gray-900 mb-6">My Profile</h1>

      <!-- Loading Spinner -->
      <div id="loadingSpinner" class="hidden text-center py-8">
        <i class="fas fa-spinner fa-spin text-3xl text-blue-600"></i>
      </div>

      <!-- Error Message -->
      <div id="errorMessage" class="hidden bg-red-100 text-red-700 p-4 mb-4 rounded"></div>

      <!-- Success Message -->
      <div id="successMessage" class="hidden bg-green-100 text-green-700 p-4 mb-4 rounded"></div>

      <!-- Avatar Section -->
      <div class="mb-8 text-center">
        <img 
          id="avatarPreview" 
          src="placeholder-avatar.jpg" 
          alt="Avatar" 
          class="hidden w-32 h-32 rounded-full mx-auto mb-4 object-cover"
        >
        <input
          type="file"
          id="avatar"
          accept="image/*"
          class="hidden"
        >
        <button 
          onclick="document.getElementById('avatar').click()"
          class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700"
        >
          Change Avatar
        </button>
      </div>

      <!-- Profile Form -->
      <form id="profileForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
          <input
            type="text"
            id="name"
            required
            class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
          >
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input
            type="email"
            id="email"
            disabled
            class="w-full px-4 py-2 border rounded-lg bg-gray-100 cursor-not-allowed"
          >
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
          <input
            type="tel"
            id="phone"
            class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
            placeholder="+251 900 000 000"
          >
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Bio</label>
          <textarea
            id="bio"
            rows="3"
            class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
            placeholder="Tell us about yourself..."
          ></textarea>
        </div>

        <div class="pt-4">
          <button
            type="submit"
            class="w-full px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700"
          >
            Save Changes
          </button>
        </div>
      </form>

      <!-- Trust Score -->
      <div class="mt-8 text-center">
        <p class="text-gray-600">Trust Score</p>
        <p id="trustScore" class="text-4xl font-bold text-blue-600">N/A</p>
      </div>
    </div>
  </main>

  <script src="../js/profile.js"></script>
</body>
</html>
