<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookmarks - U-Rent</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen">
  <!-- Navigation Bar -->
  <nav class="bg-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16">
        <div class="flex items-center">
          <a href="../index.html" class="text-2xl font-bold text-blue-600">U-Rent</a>
        </div>
        <div class="flex items-center space-x-4">
          <a href="../index.html" class="text-gray-600 hover:text-blue-600">Home</a>
          <a href="./my-items.html" class="text-gray-600 hover:text-blue-600">My Items</a>
          <a href="bookmarks.html" class="text-blue-600 font-semibold">Bookmarks</a>
          <button onclick="logout()" class="text-gray-600 hover:text-red-600">Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-3xl font-bold text-gray-900">My Bookmarks</h1>
      <a href="../index.html" class="text-blue-600 hover:text-blue-700">
        <i class="fas fa-search mr-2"></i>Browse More Items
      </a>
    </div>

    <!-- Loading Spinner -->
    <div id="loadingSpinner" class="hidden">
      <div class="flex justify-center items-center py-12">
        <i class="fas fa-spinner fa-spin text-3xl text-blue-600"></i>
      </div>
    </div>

    <!-- Error Message -->
    <div id="errorMessage" class="hidden bg-red-100 text-red-700 p-4 rounded-lg mb-6"></div>

    <!-- No Bookmarks Message -->
    <div id="noBookmarksMessage" class="hidden">
      <div class="text-center py-12">
        <i class="fas fa-bookmark text-5xl text-gray-300 mb-4"></i>
        <h3 class="text-xl font-semibold text-gray-800 mb-2">No Bookmarks Yet</h3>
        <p class="text-gray-600 mb-6">Start exploring and save items you're interested in!</p>
        <a href="../index.html" class="inline-block bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition-colors">
          <i class="fas fa-search mr-2"></i>Browse Items
        </a>
      </div>
    </div>

    <!-- Bookmarks Grid -->
    <div id="bookmarksGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </div>

  <script>
    function logout() {
      localStorage.removeItem("authToken");
      localStorage.removeItem("userData");
      window.location.href = "../login.html";
    }
  </script>
  <script src="../js/bookmarks.js"></script>
</body>
</html>
