<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - U-Rent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      .bg-gradient {
        background: linear-gradient(to right, #3b82f6, #2563eb);
      }
    </style>
  </head>
  <body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-sm">
      <div class="container mx-auto px-4 py-4">
        <div class="flex justify-between items-center">
          <div class="flex items-center space-x-8">
            <a href="../index.html" class="text-2xl font-bold text-blue-600"
              >U-Rent</a
            >
            <nav class="hidden md:flex space-x-6">
              <a href="../index.html" class="text-gray-600 hover:text-blue-600"
                >Home</a
              >
              <a
                href="global-chat.html"
                class="text-gray-600 hover:text-blue-600"
                >Chat</a
              >
              <a href="bookmarks.html" class="text-gray-600 hover:text-blue-600"
                >Bookmarks</a
              >
            </nav>
          </div>
          <div class="flex items-center space-x-4">
            <a href="../login.html" class="text-gray-600 hover:text-blue-600"
              >Login</a
            >
          </div>
        </div>
      </div>
    </header>

    <main class="container mx-auto px-4 py-8">
      <div
        class="max-w-md mx-auto bg-white rounded-lg shadow-lg overflow-hidden"
      >
        <div class="p-8 space-y-6">
          <div>
            <h2 class="text-center text-3xl font-extrabold text-gray-900">
              Create your account
            </h2>
            <p class="mt-2 text-center text-sm text-gray-600">
              Join U-Rent and start renting items today
            </p>
          </div>

          <!-- Error message container -->
          <div
            id="error-message"
            class="hidden bg-red-100 border-l-4 border-red-500 text-red-700 p-4 rounded-md"
            role="alert"
          >
            <div class="flex">
              <div class="flex-shrink-0">
                <i class="fas fa-exclamation-circle"></i>
              </div>
              <div class="ml-3">
                <span class="block sm:inline"></span>
              </div>
            </div>
          </div>

          <!-- Success message container -->
          <div
            id="success-message"
            class="hidden bg-green-100 border-l-4 border-green-500 text-green-700 p-4 rounded-md"
            role="alert"
          >
            <div class="flex">
              <div class="flex-shrink-0">
                <i class="fas fa-check-circle"></i>
              </div>
              <div class="ml-3">
                <span class="block sm:inline"></span>
              </div>
            </div>
          </div>

          <!-- Signup Form -->
          <form id="signup-form" class="space-y-4">
            <div>
              <label for="name" class="block text-sm font-medium text-gray-700"
                >Full Name</label
              >
              <input
                id="name"
                name="name"
                type="text"
                required
                class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                placeholder="Enter your full name"
              />
            </div>

            <div>
              <label for="email" class="block text-sm font-medium text-gray-700"
                >Email address</label
              >
              <input
                id="email"
                name="email"
                type="email"
                required
                class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                placeholder="Enter your email"
              />
            </div>

            <div>
              <label
                for="phoneNumber"
                class="block text-sm font-medium text-gray-700"
                >Phone Number</label
              >
              <input
                id="phoneNumber"
                name="phoneNumber"
                type="tel"
                class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                placeholder="Enter your phone number (optional)"
              />
            </div>

            <div>
              <label
                for="password"
                class="block text-sm font-medium text-gray-700"
                >Password</label
              >
              <input
                id="password"
                name="password"
                type="password"
                required
                class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                placeholder="Create a password"
              />
            </div>

            <div>
              <label
                for="confirmPassword"
                class="block text-sm font-medium text-gray-700"
                >Confirm Password</label
              >
              <input
                id="confirmPassword"
                name="confirmPassword"
                type="password"
                required
                class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                placeholder="Confirm your password"
              />
            </div>

            <div>
              <label for="bio" class="block text-sm font-medium text-gray-700"
                >Bio</label
              >
              <textarea
                id="bio"
                name="bio"
                rows="3"
                class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                placeholder="Tell us about yourself (optional)"
              ></textarea>
            </div>

            <div>
              <button
                type="submit"
                class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-gradient hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
              >
                Sign Up
              </button>
            </div>

            <div class="text-center">
              <p class="text-sm text-gray-600">
                Already have an account?
                <a
                  href="../login.html"
                  class="font-medium text-blue-600 hover:text-blue-500"
                >
                  Login here
                </a>
              </p>
            </div>
          </form>
        </div>
      </div>
    </main>

    <!-- Include the external JavaScript file -->
    <script src="../js/signup.js"></script>
  </body>
</html>
